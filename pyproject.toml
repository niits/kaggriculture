[project]
name = "kaggriculture"
version = "0.1.0"
description = "Kaggriculture - Create an agent to play in this farming simulation and compete with others to maximize your income"
readme = "README.md"
authors = [
    { name = "niits", email = "trungtdxz@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "kaggle==1.7.4.5",
    "kaggle-environments==1.18.0",
    "matplotlib==3.7.2",
    "numpy==1.26.4",
    "pandas==2.2.3",
    "seaborn==0.12.2",
    "tqdm==4.67.1",
]

[project.scripts]
kaggriculture = "kaggriculture:main"
kaggriculture-benchmark = "kaggriculture.evaluation.baseline_benchmark:main"
kaggriculture-submit = "kaggriculture.submission:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel==6.17.1",
    "ruff==0.12.5",
]
